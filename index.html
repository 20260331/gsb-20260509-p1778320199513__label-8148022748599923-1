<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量去水印工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        /* --- 核心变量系统 --- */
        :root {
            --bg-app: #f8fafc;
            --header-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent: #ec4899;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --btn-text: #ffffff;
            --canvas-bg: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.7);
        }

        [data-theme="deepBlue"] {
            --bg-app: #0f172a;
            --header-grad: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            --surface: #1e293b;
            --text-main: #38bdf8;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            --btn-text: #ffffff;
            --canvas-bg: #000000;
            --glass-bg: rgba(30, 41, 59, 0.7);
        }

        /* --- 基础样式 --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            transition: background 0.4s ease, color 0.4s ease;
            min-height: 100vh;
            padding-bottom: 120px;
        }

        header {
            background: var(--header-grad);
            padding: 80px 20px;
            text-align: center;
            color: white;
            position: relative;
            clip-path: ellipse(150% 100% at 50% 0%);
        }

        /* --- 优化后的主题切换器 --- */
        .theme-panel {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            padding: 8px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .theme-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .theme-btn svg { width: 18px; height: 18px; color: var(--text-main); }

        .theme-options-wrap {
            display: flex;
            gap: 8px;
            width: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(10px);
        }

        .theme-panel:hover .theme-options-wrap {
            width: 80px;
            opacity: 1;
            margin-left: 8px;
            transform: translateX(0);
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .color-dot:hover { 
            filter: brightness(0.85);
        }

        .color-dot.active { 
            border: 2px solid var(--accent);
        }

        .dot-macaron { background: linear-gradient(135deg, #6366f1, #a855f7); }
        .dot-deepblue { background: linear-gradient(135deg, #1e1b4b, #312e81); }

        /* --- 容器 & 上传 --- */
        .container { max-width: 1200px; margin: -40px auto 0; padding: 0 20px; position: relative; z-index: 10; }

        #dropzone {
            border: 2px dashed var(--border);
            border-radius: 24px;
            padding: 80px 40px;
            text-align: center;
            background: var(--surface);
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: var(--shadow);
        }
        #dropzone:hover { border-color: var(--accent); transform: translateY(-2px); }
        #dropzone p { font-size: 18px; color: var(--text-sub); }

        /* --- 画廊卡片 --- */
        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .image-card {
            background: var(--surface);
            border-radius: 20px;
            overflow: visible;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.3s ease;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 280px;
            background: var(--canvas-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 20px 20px 0 0;
        }

        canvas { max-width: 100%; max-height: 100%; cursor: crosshair; }

        .card-body { padding: 20px; border-radius: 0 0 20px 20px; overflow: hidden; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 10px;
            background: var(--bg-app);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-annotated { color: var(--accent); background: rgba(236, 72, 153, 0.1); }
        .status-done { color: #10b981; background: rgba(16, 185, 129, 0.1); }

        /* --- 操作栏 --- */
        .action-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            padding: 15px 30px;
            border-radius: 100px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            border: 1px solid var(--border);
        }

        .btn-main { 
            background: var(--accent); 
            color: white; 
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-main:hover { opacity: 0.9; transform: scale(1.05); }
        .btn-main:disabled { filter: grayscale(1); opacity: 0.5; }

        .export-options { display: flex; gap: 15px; border-left: 1px solid var(--border); padding-left: 20px; }
        .export-options label { font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; }

        /* --- 历史记录面板 --- */
        .history-toggle {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: all 0.3s;
        }
        .history-toggle:hover { background: var(--accent); color: white; }
        .history-toggle svg { width: 14px; height: 14px; }

        .compare-toggle {
            position: absolute;
            top: 8px;
            right: 42px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: all 0.3s;
        }
        .compare-toggle:hover { background: var(--accent); color: white; }
        .compare-toggle.active { background: var(--accent); color: white; }
        .compare-toggle svg { width: 14px; height: 14px; }

        .history-panel {
            position: absolute;
            top: 0; right: 0;
            width: 240px;
            height: 100%;
            background: var(--surface);
            border-left: 1px solid var(--border);
            box-shadow: -4px 0 16px rgba(0,0,0,0.08);
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            display: flex;
            flex-direction: column;
            border-radius: 0 20px 20px 0;
        }
        .history-panel.open { transform: translateX(0); }

        .history-header {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .history-header span {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }
        .history-close {
            width: 22px; height: 22px;
            border: none; background: none;
            cursor: pointer; color: var(--text-sub);
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .history-close:hover { background: var(--bg-app); }
        .history-close svg { width: 12px; height: 12px; }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .history-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 11px;
            color: var(--text-sub);
        }
        .history-item:hover { background: var(--bg-app); }
        .history-item.active { background: var(--bg-app); color: var(--text-main); font-weight: 600; }
        .history-item.future { opacity: 0.4; }

        .history-thumb {
            width: 36px; height: 36px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--canvas-bg);
        }
        .history-info { flex: 1; min-width: 0; }
        .history-label {
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-time { font-size: 10px; color: var(--text-sub); margin-top: 1px; }

        .history-footer {
            padding: 8px;
            display: flex;
            gap: 6px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .history-footer button {
            flex: 1;
            padding: 6px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .history-footer button:hover:not(:disabled) { background: var(--bg-app); }
        .history-footer button:disabled { opacity: 0.35; cursor: not-allowed; }
        .history-footer button svg { width: 14px; height: 14px; }

        /* --- 动画 & 反馈 --- */
        #progress-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 4px; z-index: 2000; display: none; }
        #progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

        #toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translate(-50%, 100px);
            padding: 12px 24px;
            background: var(--text-main);
            color: var(--surface);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.4s ease;
            z-index: 3000;
            pointer-events: none;
            opacity: 0;
        }
    </style>
</head>
<body data-theme="macaron">

<div id="progress-wrap"><div id="progress-bar"></div></div>

<header>
    <h1>批量去水印工具</h1>
    
    <div class="theme-panel">
        <div class="theme-btn" id="currentThemeIcon">
            </div>
        <div class="theme-options-wrap">
            <div class="color-dot dot-macaron active" data-theme="macaron"></div>
            <div class="color-dot dot-deepblue" data-theme="deepBlue"></div>
        </div>
    </div>
</header>

<div class="container">
    <div id="dropzone" onclick="document.getElementById('fileInput').click()">
        <p>🚀 拖拽图片到这里，或者 <strong>点击浏览文件</strong></p>
        <p style="font-size: 14px; margin-top: 10px; opacity: 0.6;">本地异步处理 • 无需上传服务器</p>
        <input type="file" id="fileInput" multiple accept="image/*" style="display: none">
    </div>

    <div id="gallery"></div>
</div>

<div class="action-bar">
    <button class="btn-main" id="btnRepair" onclick="Core.processAll()">开始修复</button>
    <div class="export-options">
        <label><input type="checkbox" id="checkZip" checked> ZIP</label>
        <label><input type="checkbox" id="checkPdf"> PDF</label>
    </div>
    <button class="btn-main" style="background: var(--text-main);" onclick="Core.exportAll()">立即导出</button>
</div>

<div id="toast"></div>

<script>
/**
 * --- 核心逻辑 ---
 */
const Store = {
    items: [],
    theme: 'macaron',
    IMAGES_STORAGE_KEY: 'watermark_images_v1'
};

const HistoryManager = {
    MAX_ENTRIES: 10,
    STORAGE_KEY: 'watermark_history_v1',
    _stacks: {},

    _getStack(itemId) {
        if (!this._stacks[itemId]) {
            this._stacks[itemId] = { entries: [], pointer: -1 };
        }
        return this._stacks[itemId];
    },

    _serializeStack(stack) {
        return {
            entries: stack.entries.map(e => ({
                label: e.label,
                timestamp: e.timestamp,
                rect: e.rect,
                status: e.status,
                thumbDataUrl: e.thumbDataUrl,
                fullDataUrl: e.fullDataUrl
            })),
            pointer: stack.pointer
        };
    },

    _serializeForStorage() {
        const data = {};
        for (const id in this._stacks) {
            data[id] = this._serializeStack(this._stacks[id]);
        }
        return data;
    },

    _deserializeFromStorage(data) {
        this._stacks = {};
        for (const id in data) {
            this._stacks[id] = {
                entries: data[id].entries.map(e => ({ ...e })),
                pointer: data[id].pointer
            };
        }
    },

    save() {
        try {
            localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this._serializeForStorage()));
        } catch (e) {
            console.warn('Failed to save history to localStorage:', e);
        }
    },

    load() {
        try {
            const raw = localStorage.getItem(this.STORAGE_KEY);
            if (raw) {
                this._deserializeFromStorage(JSON.parse(raw));
                return true;
            }
        } catch (e) {
            console.warn('Failed to load history from localStorage:', e);
        }
        return false;
    },

    push(itemId, entry) {
        const stack = this._getStack(itemId);
        stack.entries = stack.entries.slice(0, stack.pointer + 1);
        stack.entries.push(entry);
        if (stack.entries.length > this.MAX_ENTRIES) {
            stack.entries.shift();
        }
        stack.pointer = stack.entries.length - 1;
        this.save();
    },

    undo(itemId) {
        const stack = this._getStack(itemId);
        if (stack.pointer <= 0) return null;
        stack.pointer--;
        this.save();
        return stack.entries[stack.pointer];
    },

    redo(itemId) {
        const stack = this._getStack(itemId);
        if (stack.pointer >= stack.entries.length - 1) return null;
        stack.pointer++;
        this.save();
        return stack.entries[stack.pointer];
    },

    goTo(itemId, index) {
        const stack = this._getStack(itemId);
        if (index < 0 || index >= stack.entries.length) return null;
        stack.pointer = index;
        this.save();
        return stack.entries[index];
    },

    canUndo(itemId) {
        const stack = this._getStack(itemId);
        return stack.pointer > 0;
    },

    canRedo(itemId) {
        const stack = this._getStack(itemId);
        return stack.pointer < stack.entries.length - 1;
    },

    getEntries(itemId) {
        const stack = this._getStack(itemId);
        return stack.entries.map((e, i) => ({
            ...e,
            index: i,
            isCurrent: i === stack.pointer,
            isFuture: i > stack.pointer
        }));
    },

    getAllStacks() {
        return this._stacks;
    },

    destroy(itemId) {
        delete this._stacks[itemId];
        this.save();
    },

    clearAll() {
        this._stacks = {};
        try {
            localStorage.removeItem(this.STORAGE_KEY);
        } catch (e) {}
    }
};

const RepairEngine = {
    async repair(bitmap, rect) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        ctx.drawImage(bitmap, 0, 0);
        if (!rect) return bitmap;

        const { x, y, w, h } = rect;
        const sampleY = Math.max(0, y - 2);
        const sampleData = ctx.getImageData(x, sampleY, w, 1).data;
        const imageData = ctx.getImageData(x, y, w, h);
        const data = imageData.data;

        for (let i = 0; i < h; i++) {
            for (let j = 0; j < w; j++) {
                const idx = (i * w + j) * 4;
                data[idx] = sampleData[j * 4];
                data[idx+1] = sampleData[j * 4 + 1];
                data[idx+2] = sampleData[j * 4 + 2];
                data[idx+3] = sampleData[j * 4 + 3];
            }
        }
        ctx.putImageData(imageData, x, y);
        ctx.filter = 'blur(4px)';
        ctx.drawImage(canvas, x, y, w, h, x, y, w, h);
        return createImageBitmap(canvas);
    }
};

class WatermarkAnnotator {
    constructor(canvas, bitmap, onUpdate) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.bitmap = bitmap;
        this.onUpdate = onUpdate;
        this.rect = null;
        this.isDrawing = false;
        this.init();
    }

    init() {
        let startX, startY;
        const getCoords = (e) => {
            const bc = this.canvas.getBoundingClientRect();
            const scaleX = this.canvas.width / bc.width;
            const scaleY = this.canvas.height / bc.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return [ (clientX - bc.left) * scaleX, (clientY - bc.top) * scaleY ];
        };

        const start = (e) => {
            this.isDrawing = true;
            [startX, startY] = getCoords(e);
        };
        const move = (e) => {
            if (!this.isDrawing) return;
            const [curX, curY] = getCoords(e);
            this.rect = { x: Math.min(startX, curX), y: Math.min(startY, curY), w: Math.abs(curX - startX), h: Math.abs(curY - startY) };
            this.render();
        };
        const end = () => {
            if (this.isDrawing) {
                this.isDrawing = false;
                this.onUpdate(this.rect);
            }
        };

        this.canvas.onmousedown = start;
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        this.render();
    }

    render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.drawImage(this.bitmap, 0, 0);
        if (this.rect) {
            this.ctx.strokeStyle = '#ec4899';
            this.ctx.lineWidth = 4;
            this.ctx.strokeRect(this.rect.x, this.rect.y, this.rect.w, this.rect.h);
            this.ctx.fillStyle = 'rgba(236, 72, 153, 0.2)';
            this.ctx.fillRect(this.rect.x, this.rect.y, this.rect.w, this.rect.h);
        }
    }
};

const Core = {
    _bitmapToDataUrl(bitmap, quality = 0.8) {
        const c = document.createElement('canvas');
        c.width = bitmap.width; c.height = bitmap.height;
        c.getContext('2d').drawImage(bitmap, 0, 0);
        return c.toDataURL('image/jpeg', quality);
    },

    async _dataUrlToBitmap(dataUrl) {
        const img = new Image();
        img.src = dataUrl;
        await new Promise((res, rej) => {
            img.onload = res;
            img.onerror = rej;
        });
        return createImageBitmap(img);
    },

    _saveItems() {
        try {
            const data = Store.items.map(item => ({
                id: item.id,
                fileName: item.file.name,
                originalDataUrl: this._bitmapToDataUrl(item.original, 0.9),
                processedDataUrl: item.processed ? this._bitmapToDataUrl(item.processed, 0.9) : null,
                rect: item.rect,
                status: item.status
            }));
            localStorage.setItem(Store.IMAGES_STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
            console.warn('Failed to save items to localStorage:', e);
        }
    },

    async _loadItems() {
        try {
            const raw = localStorage.getItem(Store.IMAGES_STORAGE_KEY);
            if (!raw) return false;
            const data = JSON.parse(raw);
            for (const saved of data) {
                const original = await this._dataUrlToBitmap(saved.originalDataUrl);
                const file = new File([], saved.fileName, { type: 'image/jpeg' });
                const item = {
                    id: saved.id,
                    file: file,
                    original: original,
                    processed: saved.processedDataUrl ? await this._dataUrlToBitmap(saved.processedDataUrl) : null,
                    rect: saved.rect,
                    status: saved.status,
                    _annotator: null,
                    _comparing: false
                };
                Store.items.push(item);
                UI.renderCard(item);
                UI.updateCard(item);
                UI.updateHistoryPanel(item.id);
            }
            return true;
        } catch (e) {
            console.warn('Failed to load items from localStorage:', e);
            return false;
        }
    },

    clearStorage() {
        try {
            localStorage.removeItem(Store.IMAGES_STORAGE_KEY);
            HistoryManager.clearAll();
        } catch (e) {}
    },

    _captureSnapshot(item, label) {
        const displayBitmap = item.processed || item.original;
        return {
            label,
            timestamp: Date.now(),
            rect: item.rect ? { ...item.rect } : null,
            status: item.status,
            thumbDataUrl: this._bitmapToDataUrl(displayBitmap, 0.4),
            fullDataUrl: this._bitmapToDataUrl(displayBitmap, 0.9)
        };
    },

    pushHistory(item, label) {
        const snapshot = this._captureSnapshot(item, label);
        HistoryManager.push(item.id, snapshot);
        UI.updateHistoryPanel(item.id);
        this._saveItems();
    },

    toggleCompare(itemId) {
        const item = Store.items.find(i => i.id === itemId);
        if (!item || !item.processed) return;
        item._comparing = !item._comparing;
        const canvas = document.getElementById(`canvas-${item.id}`);
        if (canvas && item._annotator) {
            item._annotator.bitmap = item._comparing ? item.original : item.processed;
            item._annotator.render();
        }
        const btn = document.getElementById(`compareToggle-${itemId}`);
        if (btn) btn.classList.toggle('active', item._comparing);
    },

    async _applySnapshot(item, snapshot) {
        item.rect = snapshot.rect ? { ...snapshot.rect } : null;
        item.status = snapshot.status;
        
        if (snapshot._processedBitmap) {
            item.processed = snapshot._processedBitmap;
        } else if (snapshot.fullDataUrl && snapshot.status === 'done') {
            item.processed = await this._dataUrlToBitmap(snapshot.fullDataUrl);
        } else if (snapshot.fullDataUrl && snapshot.status !== 'done') {
            item.processed = null;
        } else if (snapshot.status !== 'done') {
            item.processed = null;
        }
        
        item._comparing = false;
        const compareBtn = document.getElementById(`compareToggle-${item.id}`);
        if (compareBtn) compareBtn.classList.remove('active');
        const canvas = document.getElementById(`canvas-${item.id}`);
        if (canvas && item._annotator) {
            item._annotator.bitmap = item.processed || item.original;
            item._annotator.rect = item.rect ? { ...item.rect } : null;
            item._annotator.render();
        }
        UI.updateCard(item);
        UI.updateHistoryPanel(item.id);
        this._saveItems();
    },

    async undo(itemId) {
        const item = Store.items.find(i => i.id === itemId);
        if (!item) return;
        const snapshot = HistoryManager.undo(itemId);
        if (snapshot) await this._applySnapshot(item, snapshot);
    },

    async redo(itemId) {
        const item = Store.items.find(i => i.id === itemId);
        if (!item) return;
        const snapshot = HistoryManager.redo(itemId);
        if (snapshot) await this._applySnapshot(item, snapshot);
    },

    async restoreTo(itemId, index) {
        const item = Store.items.find(i => i.id === itemId);
        if (!item) return;
        const snapshot = HistoryManager.goTo(itemId, index);
        if (snapshot) await this._applySnapshot(item, snapshot);
    },

    async handleUpload(files) {
        for (const file of files) {
            const id = 'img_' + Math.random().toString(36).slice(2, 9);
            const bitmap = await createImageBitmap(file);
            const item = { id, file, original: bitmap, processed: null, rect: null, status: 'pending', _annotator: null };
            Store.items.push(item);
            UI.renderCard(item);
            this.pushHistory(item, '原始图片');
        }
        this._saveItems();
    },

    async processAll() {
        const queue = Store.items.filter(i => i.status === 'annotated');
        if (queue.length === 0) return UI.toast("请先框选水印区域");
        UI.progress(0, true);
        for (let i = 0; i < queue.length; i++) {
            const item = queue[i];
            item.processed = await RepairEngine.repair(item.original, item.rect);
            item.status = 'done';
            const snapshot = this._captureSnapshot(item, '修复完成');
            snapshot._processedBitmap = item.processed;
            HistoryManager.push(item.id, snapshot);
            UI.updateCard(item);
            UI.updateHistoryPanel(item.id);
            UI.progress(((i+1)/queue.length) * 100);
        }
        this._saveItems();
        UI.progress(100, false);
        UI.toast("处理完成");
    },

    async exportAll() {
        const done = Store.items.filter(i => i.status === 'done');
        if (done.length === 0) return UI.toast("没有可导出的图片");
        
        if (document.getElementById('checkZip').checked) {
            const zip = new JSZip();
            done.forEach(item => {
                const canvas = document.createElement('canvas');
                canvas.width = item.processed.width; canvas.height = item.processed.height;
                canvas.getContext('2d').drawImage(item.processed, 0, 0);
                zip.file(`fixed_${item.file.name}`, canvas.toDataURL('image/jpeg', 0.9).split(',')[1], {base64: true});
            });
            const blob = await zip.generateAsync({type: "blob"});
            UI.download(blob, "images.zip");
        }
        if (document.getElementById('checkPdf').checked) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            done.forEach((item, i) => {
                const canvas = document.createElement('canvas');
                canvas.width = item.processed.width; canvas.height = item.processed.height;
                canvas.getContext('2d').drawImage(item.processed, 0, 0);
                if (i > 0) doc.addPage();
                doc.addImage(canvas.toDataURL('image/jpeg'), 'JPEG', 10, 10, 190, 110);
            });
            doc.save("report.pdf");
        }
    }
};

const UI = {
    icons: {
        macaron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`,
        deepBlue: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`
    },

    initTheme() {
        this.updateThemeUI('macaron');
        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', (e) => {
                const theme = e.target.dataset.theme;
                this.updateThemeUI(theme);
            });
        });
    },

    updateThemeUI(theme) {
        document.body.setAttribute('data-theme', theme);
        document.getElementById('currentThemeIcon').innerHTML = this.icons[theme];
        document.querySelectorAll('.color-dot').forEach(d => {
            d.classList.toggle('active', d.dataset.theme === theme);
        });
    },

    renderCard(item) {
        const gallery = document.getElementById('gallery');
        const card = document.createElement('div');
        card.className = 'image-card';
        card.innerHTML = `
            <div class="canvas-container">
                <canvas id="canvas-${item.id}"></canvas>
                <button class="compare-toggle" id="compareToggle-${item.id}" title="对比前后" style="display:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18"/><rect x="14" y="3" width="7" height="18"/></svg>
                </button>
                <button class="history-toggle" id="histToggle-${item.id}" title="历史记录">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </button>
                <div class="history-panel" id="histPanel-${item.id}">
                    <div class="history-header">
                        <span>历史记录</span>
                        <button class="history-close" id="histClose-${item.id}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <div class="history-list" id="histList-${item.id}"></div>
                    <div class="history-footer">
                        <button id="histUndo-${item.id}" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                            撤销
                        </button>
                        <button id="histRedo-${item.id}" disabled>
                            重做
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <span class="status-badge" id="badge-${item.id}">待标注</span>
                <p style="font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.file.name}</p>
            </div>
        `;
        gallery.prepend(card);

        const canvas = document.getElementById(`canvas-${item.id}`);
        const annotator = new WatermarkAnnotator(canvas, item.original, (rect) => {
            item.rect = rect;
            item.status = 'annotated';
            Core.pushHistory(item, '标注区域');
            this.updateCard(item);
        });
        item._annotator = annotator;

        document.getElementById(`compareToggle-${item.id}`).addEventListener('click', () => Core.toggleCompare(item.id));
        document.getElementById(`histToggle-${item.id}`).addEventListener('click', () => {
            document.getElementById(`histPanel-${item.id}`).classList.toggle('open');
        });
        document.getElementById(`histClose-${item.id}`).addEventListener('click', () => {
            document.getElementById(`histPanel-${item.id}`).classList.remove('open');
        });
        document.getElementById(`histUndo-${item.id}`).addEventListener('click', () => Core.undo(item.id));
        document.getElementById(`histRedo-${item.id}`).addEventListener('click', () => Core.redo(item.id));
    },

    updateCard(item) {
        const badge = document.getElementById(`badge-${item.id}`);
        const compareBtn = document.getElementById(`compareToggle-${item.id}`);
        if (item.status === 'pending') {
            badge.innerText = "待标注";
            badge.className = "status-badge";
            if (compareBtn) compareBtn.style.display = 'none';
        } else if (item.status === 'annotated') {
            badge.innerText = "已标注";
            badge.className = "status-badge status-annotated";
            if (compareBtn) compareBtn.style.display = 'none';
        } else if (item.status === 'done') {
            badge.innerText = "完成";
            badge.className = "status-badge status-done";
            if (compareBtn) compareBtn.style.display = 'flex';
            if (item._comparing) {
                item._comparing = false;
                if (compareBtn) compareBtn.classList.remove('active');
            }
        }
    },

    updateHistoryPanel(itemId) {
        const listEl = document.getElementById(`histList-${itemId}`);
        const undoBtn = document.getElementById(`histUndo-${itemId}`);
        const redoBtn = document.getElementById(`histRedo-${itemId}`);
        if (!listEl) return;

        const entries = HistoryManager.getEntries(itemId);
        listEl.innerHTML = entries.map(e => {
            const time = new Date(e.timestamp);
            const timeStr = time.getHours().toString().padStart(2,'0') + ':' +
                            time.getMinutes().toString().padStart(2,'0') + ':' +
                            time.getSeconds().toString().padStart(2,'0');
            return `
                <div class="history-item${e.isCurrent ? ' active' : ''}${e.isFuture ? ' future' : ''}" data-index="${e.index}" data-item-id="${itemId}">
                    <img class="history-thumb" src="${e.thumbDataUrl}" alt="">
                    <div class="history-info">
                        <div class="history-label">${e.label}</div>
                        <div class="history-time">${timeStr}</div>
                    </div>
                </div>
            `;
        }).join('');

        listEl.querySelectorAll('.history-item').forEach(el => {
            el.addEventListener('click', () => {
                Core.restoreTo(el.dataset.itemId, parseInt(el.dataset.index));
            });
        });

        if (undoBtn) undoBtn.disabled = !HistoryManager.canUndo(itemId);
        if (redoBtn) redoBtn.disabled = !HistoryManager.canRedo(itemId);
    },

    toast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.transform = 'translate(-50%, 0)';
        t.style.opacity = '1';
        setTimeout(() => {
            t.style.transform = 'translate(-50%, 100px)';
            t.style.opacity = '0';
        }, 2500);
    },

    progress(val, show) {
        const wrap = document.getElementById('progress-wrap');
        wrap.style.display = show ? 'block' : 'none';
        document.getElementById('progress-bar').style.width = val + '%';
    },

    download(blob, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
    }
};

// 事件绑定
document.getElementById('fileInput').onchange = (e) => Core.handleUpload(e.target.files);
const dz = document.getElementById('dropzone');
dz.ondragover = (e) => { e.preventDefault(); dz.style.borderColor = 'var(--accent)'; };
dz.ondrop = (e) => { e.preventDefault(); Core.handleUpload(e.dataTransfer.files); };

UI.initTheme();

// 页面加载时恢复数据
HistoryManager.load();
Core._loadItems();
</script>
</body>
