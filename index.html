<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量去水印工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        /* --- 核心变量系统 --- */
        :root {
            --bg-app: #f8fafc;
            --header-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent: #ec4899;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --btn-text: #ffffff;
            --canvas-bg: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.7);
        }

        [data-theme="deepBlue"] {
            --bg-app: #0f172a;
            --header-grad: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            --surface: #1e293b;
            --text-main: #38bdf8;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            --btn-text: #ffffff;
            --canvas-bg: #000000;
            --glass-bg: rgba(30, 41, 59, 0.7);
        }

        /* --- 基础样式 --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            transition: background 0.4s ease, color 0.4s ease;
            min-height: 100vh;
            padding-bottom: 120px;
        }

        header {
            background: var(--header-grad);
            padding: 80px 20px;
            text-align: center;
            color: white;
            position: relative;
            clip-path: ellipse(150% 100% at 50% 0%);
        }

        /* --- 优化后的主题切换器 --- */
        .theme-panel {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            padding: 8px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .theme-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .theme-btn svg { width: 18px; height: 18px; color: var(--text-main); }

        .theme-options-wrap {
            display: flex;
            gap: 8px;
            width: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(10px);
        }

        .theme-panel:hover .theme-options-wrap {
            width: 80px;
            opacity: 1;
            margin-left: 8px;
            transform: translateX(0);
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .color-dot:hover { 
            filter: brightness(0.85);
        }

        .color-dot.active { 
            border: 2px solid var(--accent);
        }

        .dot-macaron { background: linear-gradient(135deg, #6366f1, #a855f7); }
        .dot-deepblue { background: linear-gradient(135deg, #1e1b4b, #312e81); }

        /* --- 容器 & 上传 --- */
        .container { max-width: 1200px; margin: -40px auto 0; padding: 0 20px; position: relative; z-index: 10; }

        #dropzone {
            border: 2px dashed var(--border);
            border-radius: 24px;
            padding: 80px 40px;
            text-align: center;
            background: var(--surface);
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: var(--shadow);
        }
        #dropzone:hover { border-color: var(--accent); transform: translateY(-2px); }
        #dropzone p { font-size: 18px; color: var(--text-sub); }

        /* --- 画廊卡片 --- */
        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .image-card {
            background: var(--surface);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.3s ease;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 280px;
            background: var(--canvas-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas { max-width: 100%; max-height: 100%; cursor: crosshair; }

        .card-body { padding: 20px; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 10px;
            background: var(--bg-app);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-annotated { color: var(--accent); background: rgba(236, 72, 153, 0.1); }
        .status-done { color: #10b981; background: rgba(16, 185, 129, 0.1); }

        /* --- 操作栏 --- */
        .history-panel {
            position: fixed;
            bottom: 110px;
            right: 30px;
            width: 320px;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            border: 1px solid var(--border);
            z-index: 999;
            overflow: hidden;
            display: none;
        }
        .history-panel.show { display: block; }
        .history-header {
            padding: 12px 16px;
            background: var(--header-grad);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-header h4 { font-size: 14px; font-weight: 600; }
        .history-actions { display: flex; gap: 8px; }
        .history-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .history-btn:hover { background: rgba(255,255,255,0.35); }
        .history-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .history-list {
            max-height: 280px;
            overflow-y: auto;
            padding: 8px;
        }
        .history-item {
            display: flex;
            gap: 12px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
        }
        .history-item:hover { background: var(--bg-app); }
        .history-item.active { background: rgba(236, 72, 153, 0.1); border: 1px solid var(--accent); }
        .history-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background: var(--canvas-bg);
            flex-shrink: 0;
            overflow: hidden;
        }
        .history-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .history-info { flex: 1; min-width: 0; }
        .history-info .name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        .history-info .time {
            font-size: 11px;
            color: var(--text-sub);
        }
        .history-toggle {
            position: fixed;
            bottom: 120px;
            right: 30px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(236, 72, 153, 0.4);
            z-index: 998;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .history-toggle:hover { transform: scale(1.1); }
        .history-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ef4444;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .action-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            padding: 15px 30px;
            border-radius: 100px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            border: 1px solid var(--border);
        }

        .btn-main { 
            background: var(--accent); 
            color: white; 
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-main:hover { opacity: 0.9; transform: scale(1.05); }
        .btn-main:disabled { filter: grayscale(1); opacity: 0.5; }

        .export-options { display: flex; gap: 15px; border-left: 1px solid var(--border); padding-left: 20px; }
        .export-options label { font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; }

        /* --- 动画 & 反馈 --- */
        #progress-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 4px; z-index: 2000; display: none; }
        #progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

        #toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translate(-50%, 100px);
            padding: 12px 24px;
            background: var(--text-main);
            color: var(--surface);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.4s ease;
            z-index: 3000;
            pointer-events: none;
            opacity: 0;
        }
    </style>
</head>
<body data-theme="macaron">

<div id="progress-wrap"><div id="progress-bar"></div></div>

<header>
    <h1>批量去水印工具</h1>
    
    <div class="theme-panel">
        <div class="theme-btn" id="currentThemeIcon">
            </div>
        <div class="theme-options-wrap">
            <div class="color-dot dot-macaron active" data-theme="macaron"></div>
            <div class="color-dot dot-deepblue" data-theme="deepBlue"></div>
        </div>
    </div>
</header>

<div class="container">
    <div id="dropzone" onclick="document.getElementById('fileInput').click()">
        <p>🚀 拖拽图片到这里，或者 <strong>点击浏览文件</strong></p>
        <p style="font-size: 14px; margin-top: 10px; opacity: 0.6;">本地异步处理 • 无需上传服务器</p>
        <input type="file" id="fileInput" multiple accept="image/*" style="display: none">
    </div>

    <div id="gallery"></div>
</div>

<div class="action-bar">
    <button class="btn-main" id="btnRepair" onclick="Core.processAll()">开始修复</button>
    <div class="export-options">
        <label><input type="checkbox" id="checkZip" checked> ZIP</label>
        <label><input type="checkbox" id="checkPdf"> PDF</label>
    </div>
    <button class="btn-main" style="background: var(--text-main);" onclick="Core.exportAll()">立即导出</button>
</div>

<div id="toast"></div>

<button class="history-toggle" id="historyToggle" onclick="UI.toggleHistory()">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 4v6h6M23 20v-6h-6"/>
        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
    </svg>
    <span class="history-badge" id="historyBadge" style="display:none">0</span>
</button>

<div class="history-panel" id="historyPanel">
    <div class="history-header">
        <h4>📜 历史记录</h4>
        <div class="history-actions">
            <button class="history-btn" id="undoBtn" onclick="HistoryManager.undo()" title="撤销 (Ctrl+Z)">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 7v6h6"/>
                    <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
                </svg>
            </button>
            <button class="history-btn" id="redoBtn" onclick="HistoryManager.redo()" title="重做 (Ctrl+Y)">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 7v6h-6"/>
                    <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="history-list" id="historyList"></div>
</div>

<script>
/**
 * --- 历史记录管理器 ---
 */
const HistoryManager = {
    MAX_HISTORY: 10,
    STORAGE_KEY: 'watermark_history',
    history: [],
    currentIndex: -1,

    init() {
        this.loadFromStorage();
        this.updateUI();
    },

    saveState(items, description = '处理') {
        const state = {
            id: 'hist_' + Date.now(),
            timestamp: Date.now(),
            description: description,
            items: this.serializeItems(items)
        };

        if (this.currentIndex < this.history.length - 1) {
            this.history = this.history.slice(0, this.currentIndex + 1);
        }

        this.history.push(state);

        if (this.history.length > this.MAX_HISTORY) {
            this.history.shift();
        } else {
            this.currentIndex++;
        }

        this.saveToStorage();
        this.updateUI();
    },

    serializeItems(items) {
        return items.map(item => ({
            id: item.id,
            fileName: item.file.name,
            rect: item.rect,
            status: item.status,
            originalDataUrl: this.bitmapToDataUrl(item.original),
            processedDataUrl: item.processed ? this.bitmapToDataUrl(item.processed) : null
        }));
    },

    bitmapToDataUrl(bitmap) {
        const canvas = document.createElement('canvas');
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        canvas.getContext('2d').drawImage(bitmap, 0, 0);
        return canvas.toDataURL('image/jpeg', 0.8);
    },

    async restoreState(index) {
        if (index < 0 || index >= this.history.length) return null;
        
        const state = this.history[index];
        const restoredItems = [];

        for (const histItem of state.items) {
            const original = await this.dataUrlToBitmap(histItem.originalDataUrl);
            const processed = histItem.processedDataUrl ? await this.dataUrlToBitmap(histItem.processedDataUrl) : null;
            
            restoredItems.push({
                id: histItem.id,
                file: new File([], histItem.fileName, { type: 'image/jpeg' }),
                original,
                processed,
                rect: histItem.rect,
                status: histItem.status
            });
        }

        this.currentIndex = index;
        this.updateUI();
        return restoredItems;
    },

    async dataUrlToBitmap(dataUrl) {
        const img = new Image();
        img.src = dataUrl;
        await new Promise(r => img.onload = r);
        return createImageBitmap(img);
    },

    undo() {
        if (this.canUndo()) {
            this.restoreAndNotify(this.currentIndex - 1);
        }
    },

    redo() {
        if (this.canRedo()) {
            this.restoreAndNotify(this.currentIndex + 1);
        }
    },

    async restoreAndNotify(index) {
        const items = await this.restoreState(index);
        if (items) {
            Store.items = items;
            UI.reRenderAll();
            UI.toast(`已恢复: ${this.history[index].description}`);
        }
    },

    canUndo() {
        return this.currentIndex > 0;
    },

    canRedo() {
        return this.currentIndex < this.history.length - 1;
    },

    saveToStorage() {
        try {
            localStorage.setItem(this.STORAGE_KEY, JSON.stringify({
                history: this.history,
                currentIndex: this.currentIndex
            }));
        } catch (e) {
            console.warn('Failed to save history to localStorage:', e);
        }
    },

    loadFromStorage() {
        try {
            const data = localStorage.getItem(this.STORAGE_KEY);
            if (data) {
                const parsed = JSON.parse(data);
                this.history = parsed.history || [];
                this.currentIndex = Math.min(parsed.currentIndex || -1, this.history.length - 1);
            }
        } catch (e) {
            console.warn('Failed to load history from localStorage:', e);
        }
    },

    clear() {
        this.history = [];
        this.currentIndex = -1;
        localStorage.removeItem(this.STORAGE_KEY);
        this.updateUI();
    },

    updateUI() {
        document.getElementById('undoBtn').disabled = !this.canUndo();
        document.getElementById('redoBtn').disabled = !this.canRedo();
        
        const badge = document.getElementById('historyBadge');
        const count = this.history.length;
        badge.textContent = count;
        badge.style.display = count > 0 ? 'flex' : 'none';

        this.renderHistoryList();
    },

    renderHistoryList() {
        const list = document.getElementById('historyList');
        list.innerHTML = '';

        if (this.history.length === 0) {
            list.innerHTML = '<p style="text-align:center; padding: 30px; color: var(--text-sub); font-size: 13px;">暂无历史记录</p>';
            return;
        }

        for (let i = this.history.length - 1; i >= 0; i--) {
            const state = this.history[i];
            const isActive = i === this.currentIndex;
            const item = document.createElement('div');
            item.className = 'history-item' + (isActive ? ' active' : '');
            item.onclick = () => this.restoreAndNotify(i);

            const thumbSrc = state.items.length > 0 ? 
                (state.items[0].processedDataUrl || state.items[0].originalDataUrl) : '';
            
            const timeStr = new Date(state.timestamp).toLocaleTimeString('zh-CN', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });

            item.innerHTML = `
                <div class="history-thumb">
                    ${thumbSrc ? `<img src="${thumbSrc}" alt="">` : ''}
                </div>
                <div class="history-info">
                    <div class="name">${state.description} (${state.items.length}张图)</div>
                    <div class="time">${timeStr} ${isActive ? '• 当前' : ''}</div>
                </div>
            `;
            list.appendChild(item);
        }
    }
};

/**
 * --- 核心逻辑 ---
 */
const Store = {
    items: [],
    theme: 'macaron'
};

const RepairEngine = {
    async repair(bitmap, rect) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        ctx.drawImage(bitmap, 0, 0);
        if (!rect) return bitmap;

        const { x, y, w, h } = rect;
        const sampleY = Math.max(0, y - 2);
        const sampleData = ctx.getImageData(x, sampleY, w, 1).data;
        const imageData = ctx.getImageData(x, y, w, h);
        const data = imageData.data;

        for (let i = 0; i < h; i++) {
            for (let j = 0; j < w; j++) {
                const idx = (i * w + j) * 4;
                data[idx] = sampleData[j * 4];
                data[idx+1] = sampleData[j * 4 + 1];
                data[idx+2] = sampleData[j * 4 + 2];
                data[idx+3] = sampleData[j * 4 + 3];
            }
        }
        ctx.putImageData(imageData, x, y);
        ctx.filter = 'blur(4px)';
        ctx.drawImage(canvas, x, y, w, h, x, y, w, h);
        return createImageBitmap(canvas);
    }
};

class WatermarkAnnotator {
    constructor(canvas, bitmap, onUpdate) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.bitmap = bitmap;
        this.onUpdate = onUpdate;
        this.rect = null;
        this.isDrawing = false;
        this.init();
    }

    init() {
        let startX, startY;
        const getCoords = (e) => {
            const bc = this.canvas.getBoundingClientRect();
            const scaleX = this.canvas.width / bc.width;
            const scaleY = this.canvas.height / bc.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return [ (clientX - bc.left) * scaleX, (clientY - bc.top) * scaleY ];
        };

        const start = (e) => {
            this.isDrawing = true;
            [startX, startY] = getCoords(e);
        };
        const move = (e) => {
            if (!this.isDrawing) return;
            const [curX, curY] = getCoords(e);
            this.rect = { x: Math.min(startX, curX), y: Math.min(startY, curY), w: Math.abs(curX - startX), h: Math.abs(curY - startY) };
            this.render();
        };
        const end = () => {
            if (this.isDrawing) {
                this.isDrawing = false;
                this.onUpdate(this.rect);
            }
        };

        this.canvas.onmousedown = start;
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        this.render();
    }

    render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.drawImage(this.bitmap, 0, 0);
        if (this.rect) {
            this.ctx.strokeStyle = '#ec4899';
            this.ctx.lineWidth = 4;
            this.ctx.strokeRect(this.rect.x, this.rect.y, this.rect.w, this.rect.h);
            this.ctx.fillStyle = 'rgba(236, 72, 153, 0.2)';
            this.ctx.fillRect(this.rect.x, this.rect.y, this.rect.w, this.rect.h);
        }
    }
};

const Core = {
    async handleUpload(files) {
        for (const file of files) {
            const id = 'img_' + Math.random().toString(36).slice(2, 9);
            const bitmap = await createImageBitmap(file);
            const item = { id, file, original: bitmap, processed: null, rect: null, status: 'pending' };
            Store.items.push(item);
            UI.renderCard(item);
        }
        if (files.length > 0) {
            HistoryManager.saveState(Store.items, `上传${files.length}张图片`);
        }
    },

    async processAll() {
        const queue = Store.items.filter(i => i.status === 'annotated');
        if (queue.length === 0) return UI.toast("请先框选水印区域");
        UI.progress(0, true);
        for (let i = 0; i < queue.length; i++) {
            const item = queue[i];
            item.processed = await RepairEngine.repair(item.original, item.rect);
            item.status = 'done';
            const canvas = document.getElementById(`canvas-${item.id}`);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(item.processed, 0, 0);
            UI.updateCard(item);
            UI.progress(((i+1)/queue.length) * 100);
        }
        UI.progress(100, false);
        HistoryManager.saveState(Store.items, `处理${queue.length}张图片`);
        UI.toast("处理完成");
    },

    async exportAll() {
        const done = Store.items.filter(i => i.status === 'done');
        if (done.length === 0) return UI.toast("没有可导出的图片");
        
        if (document.getElementById('checkZip').checked) {
            const zip = new JSZip();
            done.forEach(item => {
                const canvas = document.createElement('canvas');
                canvas.width = item.processed.width; canvas.height = item.processed.height;
                canvas.getContext('2d').drawImage(item.processed, 0, 0);
                zip.file(`fixed_${item.file.name}`, canvas.toDataURL('image/jpeg', 0.9).split(',')[1], {base64: true});
            });
            const blob = await zip.generateAsync({type: "blob"});
            UI.download(blob, "images.zip");
        }
        if (document.getElementById('checkPdf').checked) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            done.forEach((item, i) => {
                const canvas = document.createElement('canvas');
                canvas.width = item.processed.width; canvas.height = item.processed.height;
                canvas.getContext('2d').drawImage(item.processed, 0, 0);
                if (i > 0) doc.addPage();
                doc.addImage(canvas.toDataURL('image/jpeg'), 'JPEG', 10, 10, 190, 110);
            });
            doc.save("report.pdf");
        }
    }
};

const UI = {
    icons: {
        macaron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`,
        deepBlue: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`
    },

    toggleHistory() {
        const panel = document.getElementById('historyPanel');
        panel.classList.toggle('show');
    },

    reRenderAll() {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';
        Store.items.forEach(item => this.renderCard(item));
    },

    initTheme() {
        this.updateThemeUI('macaron');
        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', (e) => {
                const theme = e.target.dataset.theme;
                this.updateThemeUI(theme);
            });
        });
    },

    updateThemeUI(theme) {
        document.body.setAttribute('data-theme', theme);
        document.getElementById('currentThemeIcon').innerHTML = this.icons[theme];
        document.querySelectorAll('.color-dot').forEach(d => {
            d.classList.toggle('active', d.dataset.theme === theme);
        });
    },

    renderCard(item) {
        const gallery = document.getElementById('gallery');
        const card = document.createElement('div');
        card.className = 'image-card';
        card.innerHTML = `
            <div class="canvas-container"><canvas id="canvas-${item.id}"></canvas></div>
            <div class="card-body">
                <span class="status-badge" id="badge-${item.id}">待标注</span>
                <p style="font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.file.name}</p>
            </div>
        `;
        gallery.prepend(card);
        const canvas = document.getElementById(`canvas-${item.id}`);
        canvas.width = item.original.width; canvas.height = item.original.height;
        
        if (item.status === 'done' && item.processed) {
            const ctx = canvas.getContext('2d');
            ctx.drawImage(item.processed, 0, 0);
        } else {
            const annotator = new WatermarkAnnotator(canvas, item.original, (rect) => {
                item.rect = rect;
                item.status = 'annotated';
                this.updateCard(item);
                HistoryManager.saveState(Store.items, `标注 ${item.file.name}`);
            });
            if (item.rect) {
                annotator.rect = item.rect;
                annotator.render();
            }
        }
        
        this.updateCard(item);
    },

    updateCard(item) {
        const badge = document.getElementById(`badge-${item.id}`);
        if (item.status === 'pending') {
            badge.innerText = "待标注";
            badge.className = "status-badge";
        } else if (item.status === 'annotated') {
            badge.innerText = "已标注";
            badge.className = "status-badge status-annotated";
        } else if (item.status === 'done') {
            badge.innerText = "完成";
            badge.className = "status-badge status-done";
        }
    },

    toast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.transform = 'translate(-50%, 0)';
        t.style.opacity = '1';
        setTimeout(() => {
            t.style.transform = 'translate(-50%, 100px)';
            t.style.opacity = '0';
        }, 2500);
    },

    progress(val, show) {
        const wrap = document.getElementById('progress-wrap');
        wrap.style.display = show ? 'block' : 'none';
        document.getElementById('progress-bar').style.width = val + '%';
    },

    download(blob, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
    }
};

// 事件绑定
document.getElementById('fileInput').onchange = (e) => Core.handleUpload(e.target.files);
const dz = document.getElementById('dropzone');
dz.ondragover = (e) => { e.preventDefault(); dz.style.borderColor = 'var(--accent)'; };
dz.ondrop = (e) => { e.preventDefault(); Core.handleUpload(e.dataTransfer.files); };

// 键盘快捷键
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
        if (e.key === 'z') {
            e.preventDefault();
            HistoryManager.undo();
        } else if (e.key === 'y') {
            e.preventDefault();
            HistoryManager.redo();
        }
    }
});

UI.initTheme();
HistoryManager.init();
</script>
