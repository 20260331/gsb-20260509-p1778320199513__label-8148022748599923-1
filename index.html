<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量去水印工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        /* --- 核心变量系统 --- */
        :root {
            --bg-app: #f8fafc;
            --header-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent: #ec4899;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --btn-text: #ffffff;
            --canvas-bg: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.7);
        }

        [data-theme="deepBlue"] {
            --bg-app: #0f172a;
            --header-grad: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            --surface: #1e293b;
            --text-main: #38bdf8;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            --btn-text: #ffffff;
            --canvas-bg: #000000;
            --glass-bg: rgba(30, 41, 59, 0.7);
        }

        /* --- 基础样式 --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            transition: background 0.4s ease, color 0.4s ease;
            min-height: 100vh;
            padding-bottom: 120px;
        }

        header {
            background: var(--header-grad);
            padding: 80px 20px;
            text-align: center;
            color: white;
            position: relative;
            clip-path: ellipse(150% 100% at 50% 0%);
        }

        /* --- 优化后的主题切换器 --- */
        .theme-panel {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            padding: 8px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .theme-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .theme-btn svg { width: 18px; height: 18px; color: var(--text-main); }

        .theme-options-wrap {
            display: flex;
            gap: 8px;
            width: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(10px);
        }

        .theme-panel:hover .theme-options-wrap {
            width: 80px;
            opacity: 1;
            margin-left: 8px;
            transform: translateX(0);
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .color-dot:hover { 
            filter: brightness(0.85);
        }

        .color-dot.active { 
            border: 2px solid var(--accent);
        }

        .dot-macaron { background: linear-gradient(135deg, #6366f1, #a855f7); }
        .dot-deepblue { background: linear-gradient(135deg, #1e1b4b, #312e81); }

        /* --- 容器 & 上传 --- */
        .container { max-width: 1200px; margin: -40px auto 0; padding: 0 20px; position: relative; z-index: 10; }

        #dropzone {
            border: 2px dashed var(--border);
            border-radius: 24px;
            padding: 80px 40px;
            text-align: center;
            background: var(--surface);
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: var(--shadow);
        }
        #dropzone:hover { border-color: var(--accent); transform: translateY(-2px); }
        #dropzone p { font-size: 18px; color: var(--text-sub); }

        /* --- 画廊卡片 --- */
        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .image-card {
            background: var(--surface);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.3s ease;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 280px;
            background: var(--canvas-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas { max-width: 100%; max-height: 100%; cursor: crosshair; }

        .card-body { padding: 20px; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 10px;
            background: var(--bg-app);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-annotated { color: var(--accent); background: rgba(236, 72, 153, 0.1); }
        .status-done { color: #10b981; background: rgba(16, 185, 129, 0.1); }

        /* --- 操作栏 --- */
        .action-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            padding: 15px 30px;
            border-radius: 100px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            border: 1px solid var(--border);
        }

        .btn-main { 
            background: var(--accent); 
            color: white; 
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-main:hover { opacity: 0.9; transform: scale(1.05); }
        .btn-main:disabled { filter: grayscale(1); opacity: 0.5; }

        .export-options { display: flex; gap: 15px; border-left: 1px solid var(--border); padding-left: 20px; }
        .export-options label { font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; }

        /* --- 动画 & 反馈 --- */
        #progress-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 4px; z-index: 2000; display: none; }
        #progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

        #toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translate(-50%, 100px);
            padding: 12px 24px;
            background: var(--text-main);
            color: var(--surface);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.4s ease;
            z-index: 3000;
            pointer-events: none;
            opacity: 0;
        }

        .history-controls {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            align-items: center;
        }

        .history-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-app);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 14px;
        }

        .history-btn:hover:not(:disabled) {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .history-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .history-separator {
            flex: 1;
            border-bottom: 1px dashed var(--border);
            margin: 0 4px;
        }

        .history-panel {
            display: none;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-app);
        }

        .history-panel.visible {
            display: block;
        }

        .history-panel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 13px;
        }

        .history-panel-item:hover {
            background: var(--surface);
        }

        .history-panel-item.current {
            background: var(--surface);
            font-weight: 600;
        }

        .history-panel-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            flex-shrink: 0;
        }

        .history-panel-item.current .dot {
            background: var(--accent);
        }

        .history-panel-item .label {
            flex: 1;
            color: var(--text-main);
        }

        .history-panel-item .time {
            font-size: 11px;
            color: var(--text-sub);
        }
    </style>
</head>
<body data-theme="macaron">

<div id="progress-wrap"><div id="progress-bar"></div></div>

<header>
    <h1>批量去水印工具</h1>
    
    <div class="theme-panel">
        <div class="theme-btn" id="currentThemeIcon">
            </div>
        <div class="theme-options-wrap">
            <div class="color-dot dot-macaron active" data-theme="macaron"></div>
            <div class="color-dot dot-deepblue" data-theme="deepBlue"></div>
        </div>
    </div>
</header>

<div class="container">
    <div id="dropzone" onclick="document.getElementById('fileInput').click()">
        <p>🚀 拖拽图片到这里，或者 <strong>点击浏览文件</strong></p>
        <p style="font-size: 14px; margin-top: 10px; opacity: 0.6;">本地异步处理 • 无需上传服务器</p>
        <input type="file" id="fileInput" multiple accept="image/*" style="display: none">
    </div>

    <div id="gallery"></div>
</div>

<div class="action-bar">
    <button class="btn-main" id="btnRepair" onclick="Core.processAll()">开始修复</button>
    <div class="export-options">
        <label><input type="checkbox" id="checkZip" checked> ZIP</label>
        <label><input type="checkbox" id="checkPdf"> PDF</label>
    </div>
    <button class="btn-main" style="background: var(--text-main);" onclick="Core.exportAll()">立即导出</button>
</div>

<div id="toast"></div>

<script>
/**
 * --- 核心逻辑 ---
 */
const Store = {
    items: [],
    annotators: {},
    fileHashes: {},
    fileNames: {},
    hashItemMap: {},
    theme: 'macaron'
};

const HistoryManager = {
    MAX_ENTRIES: 10,
    STORAGE_KEY: 'wm_tool_history',
    IMAGE_KEY: 'wm_tool_images',
    _stacks: {},

    init(itemId, initialState) {
        this._stacks[itemId] = {
            entries: [{ ...initialState, timestamp: Date.now() }],
            cursor: 0
        };
    },

    push(itemId, state) {
        const stack = this._stacks[itemId];
        if (!stack) return;
        stack.entries = stack.entries.slice(0, stack.cursor + 1);
        stack.entries.push({ ...state, timestamp: Date.now() });
        if (stack.entries.length > this.MAX_ENTRIES) {
            stack.entries.shift();
        }
        stack.cursor = stack.entries.length - 1;
    },

    canUndo(itemId) {
        const stack = this._stacks[itemId];
        return stack && stack.cursor > 0;
    },

    canRedo(itemId) {
        const stack = this._stacks[itemId];
        return stack && stack.cursor < stack.entries.length - 1;
    },

    undo(itemId) {
        const stack = this._stacks[itemId];
        if (!stack || !this.canUndo(itemId)) return null;
        stack.cursor--;
        return { ...stack.entries[stack.cursor] };
    },

    redo(itemId) {
        const stack = this._stacks[itemId];
        if (!stack || !this.canRedo(itemId)) return null;
        stack.cursor++;
        return { ...stack.entries[stack.cursor] };
    },

    jumpTo(itemId, index) {
        const stack = this._stacks[itemId];
        if (!stack || index < 0 || index >= stack.entries.length) return null;
        stack.cursor = index;
        return { ...stack.entries[stack.cursor] };
    },

    getEntries(itemId) {
        const stack = this._stacks[itemId];
        if (!stack) return [];
        return stack.entries.map((e, i) => ({
            index: i,
            label: e.label,
            timestamp: e.timestamp,
            isCurrent: i === stack.cursor
        }));
    },

    getCursor(itemId) {
        const stack = this._stacks[itemId];
        return stack ? stack.cursor : -1;
    },

    getCurrentState(itemId) {
        const stack = this._stacks[itemId];
        if (!stack) return null;
        return { ...stack.entries[stack.cursor] };
    },

    bitmapToDataUrl(bitmap, quality) {
        const canvas = document.createElement('canvas');
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        canvas.getContext('2d').drawImage(bitmap, 0, 0);
        return canvas.toDataURL('image/jpeg', quality || 0.6);
    },

    async dataUrlToBitmap(dataUrl) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => createImageBitmap(img).then(resolve).catch(reject);
            img.onerror = reject;
            img.src = dataUrl;
        });
    },

    save(fileHash, fileName) {
        try {
            const allData = this._loadAll();
            const itemId = Store.hashItemMap[fileHash];
            const serializable = {};
            if (itemId && this._stacks[itemId]) {
                serializable[itemId] = {
                    entries: this._stacks[itemId].entries,
                    cursor: this._stacks[itemId].cursor
                };
            }
            allData[fileHash] = { stacks: serializable, fileName: fileName || '' };
            localStorage.setItem(this.STORAGE_KEY, JSON.stringify(allData));
        } catch (e) {
            console.warn('历史记录保存失败:', e);
        }
    },

    saveImageData(fileHash, originalBitmap, processedBitmap) {
        try {
            const allImages = this._loadAllImages();
            const entry = allImages[fileHash] || {};
            if (originalBitmap) {
                entry.original = this.bitmapToDataUrl(originalBitmap);
            }
            if (processedBitmap) {
                entry.processed = this.bitmapToDataUrl(processedBitmap);
            }
            allImages[fileHash] = entry;
            localStorage.setItem(this.IMAGE_KEY, JSON.stringify(allImages));
        } catch (e) {
            console.warn('图片数据保存失败:', e);
        }
    },

    getStoredImageData(fileHash) {
        try {
            const allImages = this._loadAllImages();
            return allImages[fileHash] || null;
        } catch (e) {
            return null;
        }
    },

    removeImageData(fileHash) {
        try {
            const allImages = this._loadAllImages();
            delete allImages[fileHash];
            localStorage.setItem(this.IMAGE_KEY, JSON.stringify(allImages));
        } catch (e) {}
    },

    load(fileHash) {
        try {
            const allData = this._loadAll();
            const data = allData[fileHash];
            if (!data) return false;
            const stacks = data.stacks || data;
            for (const itemId in stacks) {
                this._stacks[itemId] = stacks[itemId];
            }
            return true;
        } catch (e) {
            console.warn('历史记录加载失败:', e);
            return false;
        }
    },

    loadOnly(fileHash) {
        try {
            const allData = this._loadAll();
            const data = allData[fileHash];
            if (!data) return null;
            const stacks = data.stacks || data;
            const result = {};
            for (const itemId in stacks) {
                result[itemId] = stacks[itemId];
            }
            return result;
        } catch (e) {
            return null;
        }
    },

    getStoredFileName(fileHash) {
        try {
            const allData = this._loadAll();
            const data = allData[fileHash];
            return data && data.fileName ? data.fileName : '';
        } catch (e) {
            return '';
        }
    },

    getAllStoredHashes() {
        try {
            const allData = this._loadAll();
            return Object.keys(allData);
        } catch (e) {
            return [];
        }
    },

    hasStoredHistory(fileHash) {
        try {
            const allData = this._loadAll();
            return !!allData[fileHash];
        } catch (e) {
            return false;
        }
    },

    _loadAll() {
        try {
            const raw = localStorage.getItem(this.STORAGE_KEY);
            return raw ? JSON.parse(raw) : {};
        } catch (e) {
            return {};
        }
    },

    _loadAllImages() {
        try {
            const raw = localStorage.getItem(this.IMAGE_KEY);
            return raw ? JSON.parse(raw) : {};
        } catch (e) {
            return {};
        }
    }
};

const RepairEngine = {
    async repair(bitmap, rect) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        ctx.drawImage(bitmap, 0, 0);
        if (!rect) return bitmap;

        const { x, y, w, h } = rect;
        const sampleY = Math.max(0, y - 2);
        const sampleData = ctx.getImageData(x, sampleY, w, 1).data;
        const imageData = ctx.getImageData(x, y, w, h);
        const data = imageData.data;

        for (let i = 0; i < h; i++) {
            for (let j = 0; j < w; j++) {
                const idx = (i * w + j) * 4;
                data[idx] = sampleData[j * 4];
                data[idx+1] = sampleData[j * 4 + 1];
                data[idx+2] = sampleData[j * 4 + 2];
                data[idx+3] = sampleData[j * 4 + 3];
            }
        }
        ctx.putImageData(imageData, x, y);
        ctx.filter = 'blur(4px)';
        ctx.drawImage(canvas, x, y, w, h, x, y, w, h);
        return createImageBitmap(canvas);
    }
};

class WatermarkAnnotator {
    constructor(canvas, bitmap, onUpdate) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.bitmap = bitmap;
        this.onUpdate = onUpdate;
        this.rect = null;
        this.isDrawing = false;
        this.init();
    }

    init() {
        let startX, startY;
        const getCoords = (e) => {
            const bc = this.canvas.getBoundingClientRect();
            const scaleX = this.canvas.width / bc.width;
            const scaleY = this.canvas.height / bc.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return [ (clientX - bc.left) * scaleX, (clientY - bc.top) * scaleY ];
        };

        const start = (e) => {
            this.isDrawing = true;
            [startX, startY] = getCoords(e);
        };
        const move = (e) => {
            if (!this.isDrawing) return;
            const [curX, curY] = getCoords(e);
            this.rect = { x: Math.min(startX, curX), y: Math.min(startY, curY), w: Math.abs(curX - startX), h: Math.abs(curY - startY) };
            this.render();
        };
        const end = () => {
            if (this.isDrawing) {
                this.isDrawing = false;
                this.onUpdate(this.rect);
            }
        };

        this.canvas.onmousedown = start;
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        this.render();
    }

    render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.drawImage(this.bitmap, 0, 0);
        if (this.rect) {
            this.ctx.strokeStyle = '#ec4899';
            this.ctx.lineWidth = 4;
            this.ctx.strokeRect(this.rect.x, this.rect.y, this.rect.w, this.rect.h);
            this.ctx.fillStyle = 'rgba(236, 72, 153, 0.2)';
            this.ctx.fillRect(this.rect.x, this.rect.y, this.rect.w, this.rect.h);
        }
    }
};

const Core = {
    async computeHash(file) {
        const buffer = await file.arrayBuffer();
        const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    },

    async handleUpload(files) {
        for (const file of files) {
            const fileHash = await this.computeHash(file);
            const bitmap = await createImageBitmap(file);
            const hasHistory = HistoryManager.hasStoredHistory(fileHash);

            if (hasHistory) {
                const loaded = HistoryManager.loadOnly(fileHash);
                if (loaded) {
                    const itemId = Object.keys(loaded)[0];
                    if (itemId) {
                        for (const id in loaded) {
                            HistoryManager._stacks[id] = loaded[id];
                        }
                        const item = { id: itemId, file, original: bitmap, processed: null, rect: null, status: 'pending' };
                        Store.items.push(item);
                        Store.fileHashes[itemId] = fileHash;
                        Store.fileNames[itemId] = file.name;
                        Store.hashItemMap[fileHash] = itemId;
                        UI.renderCard(item);
                        const currentState = HistoryManager.getCurrentState(itemId);
                        if (currentState) {
                            item.status = currentState.status;
                            item.rect = currentState.rect ? { ...currentState.rect } : null;
                            if (currentState.status === 'done' && currentState.rect) {
                                item.processed = await RepairEngine.repair(item.original, item.rect);
                            }
                            UI.restoreState(item, currentState);
                            UI.updateHistoryControls(itemId);
                        }
                        HistoryManager.saveImageData(fileHash, bitmap, item.processed);
                        continue;
                    }
                }
            }

            const id = 'img_' + Math.random().toString(36).slice(2, 9);
            const item = { id, file, original: bitmap, processed: null, rect: null, status: 'pending' };
            Store.items.push(item);
            Store.fileHashes[id] = fileHash;
            Store.fileNames[id] = file.name;
            Store.hashItemMap[fileHash] = id;
            HistoryManager.init(id, { label: '原始图片', status: 'pending', rect: null });
            UI.renderCard(item);
            HistoryManager.save(fileHash, file.name);
            HistoryManager.saveImageData(fileHash, bitmap, null);
        }
    },

    async processAll() {
        const queue = Store.items.filter(i => i.status === 'annotated');
        if (queue.length === 0) return UI.toast("请先框选水印区域");
        UI.progress(0, true);
        for (let i = 0; i < queue.length; i++) {
            const item = queue[i];
            item.processed = await RepairEngine.repair(item.original, item.rect);
            item.status = 'done';
            HistoryManager.push(item.id, { label: '去水印处理', status: 'done', rect: { ...item.rect } });
            HistoryManager.save(Store.fileHashes[item.id], Store.fileNames[item.id]);
            HistoryManager.saveImageData(Store.fileHashes[item.id], item.original, item.processed);
            UI.updateCard(item);
            UI.progress(((i+1)/queue.length) * 100);
        }
        UI.progress(100, false);
        UI.toast("处理完成");
    },

    undo(itemId) {
        const state = HistoryManager.undo(itemId);
        if (!state) return;
        this._applyHistoryState(itemId, state);
    },

    redo(itemId) {
        const state = HistoryManager.redo(itemId);
        if (!state) return;
        this._applyHistoryState(itemId, state);
    },

    jumpToHistory(itemId, index) {
        const state = HistoryManager.jumpTo(itemId, index);
        if (!state) return;
        this._applyHistoryState(itemId, state);
    },

    _applyHistoryState(itemId, state) {
        const item = Store.items.find(i => i.id === itemId);
        if (!item) return;
        item.status = state.status;
        item.rect = state.rect ? { ...state.rect } : null;
        if (state.status !== 'done') {
            item.processed = null;
        }
        if (state.status === 'done' && !item.processed) {
            const fileHash = Store.fileHashes[itemId];
            const imageData = HistoryManager.getStoredImageData(fileHash);
            if (imageData && imageData.processed) {
                HistoryManager.dataUrlToBitmap(imageData.processed).then(bitmap => {
                    item.processed = bitmap;
                    UI.restoreState(item, state);
                    HistoryManager.save(Store.fileHashes[itemId], Store.fileNames[itemId]);
                });
            } else if (item.rect && item.original) {
                RepairEngine.repair(item.original, item.rect).then(bitmap => {
                    item.processed = bitmap;
                    UI.restoreState(item, state);
                    HistoryManager.saveImageData(fileHash, item.original, bitmap);
                    HistoryManager.save(Store.fileHashes[itemId], Store.fileNames[itemId]);
                });
            } else {
                UI.restoreState(item, state);
                HistoryManager.save(Store.fileHashes[itemId], Store.fileNames[itemId]);
            }
        } else {
            UI.restoreState(item, state);
            HistoryManager.save(Store.fileHashes[itemId], Store.fileNames[itemId]);
        }
        UI.updateHistoryControls(itemId);
    },

    async exportAll() {
        const done = Store.items.filter(i => i.status === 'done');
        if (done.length === 0) return UI.toast("没有可导出的图片");
        
        if (document.getElementById('checkZip').checked) {
            const zip = new JSZip();
            done.forEach(item => {
                const canvas = document.createElement('canvas');
                canvas.width = item.processed.width; canvas.height = item.processed.height;
                canvas.getContext('2d').drawImage(item.processed, 0, 0);
                const name = item.file ? item.file.name : (Store.fileNames[item.id] || 'image.jpg');
                zip.file(`fixed_${name}`, canvas.toDataURL('image/jpeg', 0.9).split(',')[1], {base64: true});
            });
            const blob = await zip.generateAsync({type: "blob"});
            UI.download(blob, "images.zip");
        }
        if (document.getElementById('checkPdf').checked) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            done.forEach((item, i) => {
                const canvas = document.createElement('canvas');
                canvas.width = item.processed.width; canvas.height = item.processed.height;
                canvas.getContext('2d').drawImage(item.processed, 0, 0);
                if (i > 0) doc.addPage();
                doc.addImage(canvas.toDataURL('image/jpeg'), 'JPEG', 10, 10, 190, 110);
            });
            doc.save("report.pdf");
        }
    }
};

const UI = {
    icons: {
        macaron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`,
        deepBlue: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`
    },

    initTheme() {
        this.updateThemeUI('macaron');
        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', (e) => {
                const theme = e.target.dataset.theme;
                this.updateThemeUI(theme);
            });
        });
    },

    updateThemeUI(theme) {
        document.body.setAttribute('data-theme', theme);
        document.getElementById('currentThemeIcon').innerHTML = this.icons[theme];
        document.querySelectorAll('.color-dot').forEach(d => {
            d.classList.toggle('active', d.dataset.theme === theme);
        });
    },

    renderCard(item) {
        const gallery = document.getElementById('gallery');
        const card = document.createElement('div');
        card.className = 'image-card';
        card.innerHTML = `
            <div class="canvas-container"><canvas id="canvas-${item.id}"></canvas></div>
            <div class="card-body">
                <span class="status-badge" id="badge-${item.id}">待标注</span>
                <p style="font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.file ? item.file.name : (Store.fileNames[item.id] || '已恢复图片')}</p>
                <div class="history-controls">
                    <button class="history-btn" id="undo-${item.id}" disabled title="撤销">&#8592;</button>
                    <button class="history-btn" id="redo-${item.id}" disabled title="重做">&#8594;</button>
                    <div class="history-separator"></div>
                    <button class="history-btn" id="histToggle-${item.id}" title="历史记录">&#9776;</button>
                </div>
                <div class="history-panel" id="histPanel-${item.id}"></div>
            </div>
        `;
        gallery.prepend(card);
        const canvas = document.getElementById(`canvas-${item.id}`);
        canvas.width = item.original.width; canvas.height = item.original.height;
        const annotator = new WatermarkAnnotator(canvas, item.original, (rect) => {
            item.rect = rect;
            item.status = 'annotated';
            HistoryManager.push(item.id, { label: '标注水印区域', status: 'annotated', rect: { ...rect } });
            HistoryManager.save(Store.fileHashes[item.id], Store.fileNames[item.id]);
            this.updateCard(item);
        });
        Store.annotators[item.id] = annotator;
        document.getElementById(`undo-${item.id}`).addEventListener('click', () => Core.undo(item.id));
        document.getElementById(`redo-${item.id}`).addEventListener('click', () => Core.redo(item.id));
        document.getElementById(`histToggle-${item.id}`).addEventListener('click', () => this.toggleHistory(item.id));
        this.renderHistoryList(item.id);
    },

    updateCard(item) {
        const badge = document.getElementById(`badge-${item.id}`);
        if (item.status === 'annotated') {
            badge.innerText = "已标注";
            badge.className = "status-badge status-annotated";
        } else if (item.status === 'done') {
            badge.innerText = "完成";
            badge.className = "status-badge status-done";
            const ctx = document.getElementById(`canvas-${item.id}`).getContext('2d');
            ctx.drawImage(item.processed, 0, 0);
        }
        this.updateHistoryControls(item.id);
    },

    toast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.transform = 'translate(-50%, 0)';
        t.style.opacity = '1';
        setTimeout(() => {
            t.style.transform = 'translate(-50%, 100px)';
            t.style.opacity = '0';
        }, 2500);
    },

    progress(val, show) {
        const wrap = document.getElementById('progress-wrap');
        wrap.style.display = show ? 'block' : 'none';
        document.getElementById('progress-bar').style.width = val + '%';
    },

    download(blob, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
    },

    toggleHistory(itemId) {
        const panel = document.getElementById(`histPanel-${itemId}`);
        if (!panel) return;
        panel.classList.toggle('visible');
        if (panel.classList.contains('visible')) {
            this.renderHistoryList(itemId);
        }
    },

    renderHistoryList(itemId) {
        const panel = document.getElementById(`histPanel-${itemId}`);
        if (!panel) return;
        const entries = HistoryManager.getEntries(itemId);
        if (entries.length === 0) {
            panel.innerHTML = '<div style="padding:12px;color:var(--text-sub);font-size:13px;">暂无历史记录</div>';
            return;
        }
        panel.innerHTML = entries.map(e => {
            const time = new Date(e.timestamp);
            const timeStr = time.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            return `<div class="history-panel-item${e.isCurrent ? ' current' : ''}" data-index="${e.index}" data-item-id="${itemId}">
                <span class="dot"></span>
                <span class="label">${e.label}</span>
                <span class="time">${timeStr}</span>
            </div>`;
        }).join('');
        panel.querySelectorAll('.history-panel-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.index, 10);
                const id = el.dataset.itemId;
                Core.jumpToHistory(id, idx);
                this.renderHistoryList(id);
            });
        });
    },

    updateHistoryControls(itemId) {
        const undoBtn = document.getElementById(`undo-${itemId}`);
        const redoBtn = document.getElementById(`redo-${itemId}`);
        if (undoBtn) undoBtn.disabled = !HistoryManager.canUndo(itemId);
        if (redoBtn) redoBtn.disabled = !HistoryManager.canRedo(itemId);
        const panel = document.getElementById(`histPanel-${itemId}`);
        if (panel && panel.classList.contains('visible')) {
            this.renderHistoryList(itemId);
        }
    },

    restoreState(item, state) {
        const badge = document.getElementById(`badge-${item.id}`);
        const annotator = Store.annotators[item.id];
        if (state.status === 'pending') {
            badge.innerText = "待标注";
            badge.className = "status-badge";
            if (annotator) {
                annotator.rect = null;
                annotator.render();
            }
        } else if (state.status === 'annotated') {
            badge.innerText = "已标注";
            badge.className = "status-badge status-annotated";
            if (annotator) {
                annotator.rect = state.rect;
                annotator.render();
            }
        } else if (state.status === 'done') {
            badge.innerText = "完成";
            badge.className = "status-badge status-done";
            const ctx = document.getElementById(`canvas-${item.id}`).getContext('2d');
            if (item.processed) {
                ctx.drawImage(item.processed, 0, 0);
            }
        }
    },

    renderRestoredCard(item) {
        const gallery = document.getElementById('gallery');
        const displayName = Store.fileNames[item.id] || '已恢复图片';
        const card = document.createElement('div');
        card.className = 'image-card';
        card.innerHTML = `
            <div class="canvas-container"><canvas id="canvas-${item.id}"></canvas></div>
            <div class="card-body">
                <span class="status-badge" id="badge-${item.id}">待标注</span>
                <p style="font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${displayName}</p>
                <div class="history-controls">
                    <button class="history-btn" id="undo-${item.id}" disabled title="撤销">&#8592;</button>
                    <button class="history-btn" id="redo-${item.id}" disabled title="重做">&#8594;</button>
                    <div class="history-separator"></div>
                    <button class="history-btn" id="histToggle-${item.id}" title="历史记录">&#9776;</button>
                </div>
                <div class="history-panel" id="histPanel-${item.id}"></div>
            </div>
        `;
        gallery.prepend(card);
        const canvas = document.getElementById(`canvas-${item.id}`);
        canvas.width = item.original.width;
        canvas.height = item.original.height;
        const annotator = new WatermarkAnnotator(canvas, item.original, (rect) => {
            item.rect = rect;
            item.status = 'annotated';
            HistoryManager.push(item.id, { label: '标注水印区域', status: 'annotated', rect: { ...rect } });
            HistoryManager.save(Store.fileHashes[item.id], Store.fileNames[item.id]);
            this.updateCard(item);
        });
        Store.annotators[item.id] = annotator;
        document.getElementById(`undo-${item.id}`).addEventListener('click', () => Core.undo(item.id));
        document.getElementById(`redo-${item.id}`).addEventListener('click', () => Core.redo(item.id));
        document.getElementById(`histToggle-${item.id}`).addEventListener('click', () => this.toggleHistory(item.id));
        this.renderHistoryList(item.id);
    },

    async initRecovery() {
        const hashes = HistoryManager.getAllStoredHashes();
        if (hashes.length === 0) return;
        for (const hash of hashes) {
            const imageData = HistoryManager.getStoredImageData(hash);
            const loaded = HistoryManager.loadOnly(hash);
            if (!loaded || !imageData || !imageData.original) continue;

            const itemId = Object.keys(loaded)[0];
            if (!itemId) continue;

            for (const id in loaded) {
                HistoryManager._stacks[id] = loaded[id];
            }

            try {
                const originalBitmap = await HistoryManager.dataUrlToBitmap(imageData.original);
                let processedBitmap = null;
                if (imageData.processed) {
                    processedBitmap = await HistoryManager.dataUrlToBitmap(imageData.processed);
                }

                const fileName = HistoryManager.getStoredFileName(hash);
                const currentState = HistoryManager.getCurrentState(itemId);
                const item = {
                    id: itemId,
                    file: null,
                    original: originalBitmap,
                    processed: processedBitmap,
                    rect: currentState ? currentState.rect : null,
                    status: currentState ? currentState.status : 'pending'
                };

                Store.items.push(item);
                Store.fileHashes[itemId] = hash;
                Store.fileNames[itemId] = fileName;
                Store.hashItemMap[hash] = itemId;

                this.renderRestoredCard(item);

                if (currentState) {
                    this.restoreState(item, currentState);
                    this.updateHistoryControls(itemId);
                }
            } catch (e) {
                console.warn('恢复图片失败:', hash, e);
            }
        }
    }
};

// 事件绑定
document.getElementById('fileInput').onchange = (e) => Core.handleUpload(e.target.files);
const dz = document.getElementById('dropzone');
dz.ondragover = (e) => { e.preventDefault(); dz.style.borderColor = 'var(--accent)'; };
dz.ondrop = (e) => { e.preventDefault(); Core.handleUpload(e.dataTransfer.files); };

UI.initTheme();
UI.initRecovery();

document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        const lastItem = Store.items[Store.items.length - 1];
        if (lastItem && HistoryManager.canUndo(lastItem.id)) Core.undo(lastItem.id);
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
        e.preventDefault();
        const lastItem = Store.items[Store.items.length - 1];
        if (lastItem && HistoryManager.canRedo(lastItem.id)) Core.redo(lastItem.id);
    }
});
</script>
